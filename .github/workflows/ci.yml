name: CI

# PR ごとに型検査・テスト・静的解析・配布物のビルドを実行する。
# ローカルの一括チェックは `just check` だが、CI では bun の script を直接呼ぶ。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型検査・テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bun のセットアップ
        uses: oven-sh/setup-bun@v2

      # 依存はすべて public レジストリから取得できる。
      - name: 依存のインストール
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

      - name: lint
        run: bun run lint

      # 配布物 (dist/index.js と型定義) が壊れていないことを見る。
      # 利用側は dist だけを import するため、ここが通らないと publish できない。
      - name: build
        run: bun run build

      # Storybook は仕様書そのもの。.storybook/ や tokens/theme.css の
      # 崩れは typecheck では捕まらないため、ビルドが通ることを見る。
      - name: build-storybook
        run: bun run build-storybook

      # main へ入ったものだけ成果物として置く。社内 UI Catalog の /core/latest/ になる。
      #
      # <important>
      # ここから社内サーバーへ push しない。GitHub のホストランナーからは社内へ
      # 届かないため、配信サーバー側が取りに来る（ui-catalog の
      # scripts/pull-storybooks.sh）。
      # 名前を storybook-static から変えるときは ui-catalog/registry.json の
      # artifact も一緒に変えること。
      # </important>
      - name: Storybook の静的成果物をアップロード（main のみ）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 30
          if-no-files-found: error

      # 上の build はこのリポジトリの node_modules を使うため、
      # 宣言漏れの依存 (phantom dependency) を検出できない。
      # 利用側を模した非巻き上げレイアウトでビルドし直して確認する。
      - name: Node のセットアップ (配布検証の npm pack / npm install 用)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配布物の検証
        run: bun run verify:package
